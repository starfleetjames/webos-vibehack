<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient glow in the colour of the focused dock app; two layers so colours crossfade. -->
  <div id="ambientA" class="ambient"></div>
  <div id="ambientB" class="ambient"></div>

  <header>
    <div id="leftBlock">
      <div id="greeting"><span id="greetingText"></span><img id="greetingIcon" class="greetingEmoji" style="display:none" src="brands/dog-face.svg" alt="🐶"></div>
      <div id="timeRow">
        <span id="clock"></span><span id="ampm"></span><span class="divider"></span>
        <span id="dateBlock"><span id="weekday"></span><span id="date"></span></span>
        <span id="weatherDivider" class="divider" aria-hidden="true"></span>
        <div id="weather" role="status" aria-live="polite">
          <span id="weatherIcon" aria-hidden="true"></span>
          <span id="weatherTemperature"></span>
          <div id="weatherDetails">
            <span id="weatherCondition">Loading weather…</span>
            <span id="weatherUpdated"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="topButtons">
      <div class="pill" id="btnSettings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.030,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.030,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.030,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
        <span>Settings</span>
      </div>
    </div>
  </header>

  <!-- Everything below the header scrolls together: dock band, tiles and the glass highlight. -->
  <div id="viewport">
    <div id="stage">
      <h2 id="gamingLabel" class="rowLabel">Game Zone</h2>
      <div id="gamingBand" class="dockBand"></div>
      <h2 id="streamingLabel" class="rowLabel">Streaming</h2>
      <div id="dockBand" class="dockBand"></div>
      <h2 id="otherLabel" class="rowLabel">Other apps</h2>
      <div id="tiles"></div>
      <div id="glass"></div>
    </div>
  </div>

  <div id="toast"></div>
  <audio id="startupSound" preload="auto"></audio>

  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script src="apps.js"></script>
  <script src="weather.js"></script>
  <script src="watchlist.js"></script>
  <script src="movies.js"></script>
  <script src="cec-input.js"></script>
  <script src="app.js"></script>
</body>
</html>
